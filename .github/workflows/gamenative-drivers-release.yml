name: Build GameNative Drivers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag name for release (e.g. gamenative-drivers-20260505)"
        required: true
        default: "gamenative-drivers-manual"
      driver_version:
        description: "Version string embedded in driver meta.json"
        required: true
        default: "dev"
  push:
    tags:
      - "gamenative-drivers-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: [freedreno, panvk, virpipe]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            glslang-tools \
            libdrm-dev \
            libssl-dev \
            libzstd-dev \
            pkg-config \
            ninja-build \
            cmake \
            python3-mako \
            python3-packaging \
            python3-yaml

          if [ "${{ matrix.backend }}" = "panvk" ]; then
            sudo apt-get install -y --no-install-recommends \
              libclc-18-dev \
              libclang-18-dev \
              libclang-cpp18-dev \
              llvm-18-dev \
              llvm-spirv-18 \
              libllvmspirvlib-18-dev \
              clang-18 \
              spirv-tools
          fi
          python -m pip install --upgrade meson ninja mako packaging pyyaml

      - name: Build host mesa_clc (PanVK)
        if: matrix.backend == 'panvk'
        run: |
          export LLVM_CONFIG=llvm-config-18
          ./scripts/gamenative/build-host-mesa-clc.sh

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Build and package backend
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          VERSION="${{ inputs.driver_version }}"
          if [ -z "${VERSION}" ]; then
            VERSION="${GITHUB_REF_NAME#gamenative-drivers-}"
            [ -n "${VERSION}" ] || VERSION="dev"
          fi

          EXTRA="-Dgallium-rusticl=false"
          if [ "${{ matrix.backend }}" = "panvk" ]; then
            EXTRA="$EXTRA -Dmesa-clc=system"
          fi
          export MESON_EXTRA_ARGS="$EXTRA"
          export PATH="${HOME}/.local/bin:${PATH}"
          if [ "${{ matrix.backend }}" = "panvk" ]; then
            export PATH="/tmp/mesa-host-tools/bin:${PATH}"
          fi
          if [ "${{ matrix.backend }}" = "virpipe" ]; then
            mkdir -p .ci-headers
            cp /usr/include/xf86drm.h .ci-headers/
            cp /usr/include/libsync.h .ci-headers/
            export CFLAGS="${CFLAGS:-} -I${PWD}/.ci-headers"
            export CXXFLAGS="${CXXFLAGS:-} -I${PWD}/.ci-headers"
          fi

          ./scripts/gamenative/build-and-package.sh "${{ matrix.backend }}" "${VERSION}" dist

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-${{ matrix.backend }}
          path: dist/*.zip

  release:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          Automated GameNative Mesa backend build.

          Backends:
          - freedreno
          - panvk
          - virpipe

          Artifacts are GameNative-compatible ZIPs with meta.json.
          EOF

      - name: Create GitHub release (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          gh release create "${{ inputs.release_tag }}" \
            --title "GameNative drivers: ${{ inputs.release_tag }}" \
            --notes-file RELEASE_NOTES.md \
            release-assets/**/*.zip
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub release (tag push)
        if: ${{ github.event_name == 'push' }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "GameNative drivers: ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            release-assets/**/*.zip
        env:
          GH_TOKEN: ${{ github.token }}
